<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SP7KJR - Status radiowy</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .status {
            font-size: 34px;
            font-weight: bold;
            margin: 30px 0;
        }

        .info {
            background: #1c1c1c;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
        }

        .label {
            color: #999;
            font-size: 15px;
            margin-bottom: 7px;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        .frequency {
            font-size: 32px;
        }

        .footer {
            margin-top: 35px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📡 SP7KJR</h1>

    <div class="subtitle">
        STATUS RADIOWY
    </div>

    <div class="status" id="status">
        Ładowanie...
    </div>

    <div class="info">
        <div class="label">OSTATNIA AKTUALIZACJA</div>
        <div class="value" id="updated">---</div>
    </div>

    <div class="info">
        <div class="label">CZĘSTOTLIWOŚĆ / ZNAK PRZEMIENNIKA</div>
        <div class="value frequency" id="frequency">---</div>
    </div>

    <div class="info">
        <div class="label">SIEĆ</div>
        <div class="value" id="network">---</div>
    </div>

    <div class="info">
        <div class="label">QTH</div>
        <div class="value" id="qth">---</div>
    </div>

    <div class="footer">
        SP7KJR • Krótkofalarstwo
    </div>

</div>

<script>

const sheetID = "1O1ScG-qOaguXs9a1Omh4icDcathXGwDEK_adtr5RpIc";

const url =
"https://docs.google.com/spreadsheets/d/" +
sheetID +
"/gviz/tq?tqx=out:json&headers=0";

fetch(url)
.then(response => response.text())
.then(data => {

    const json = JSON.parse(
        data.substring(47).slice(0, -2)
    );

    const rows = json.table.rows;

    document.getElementById("status").innerText =
        rows[0].c[1].v;

    document.getElementById("updated").innerText =
        rows[1].c[1].v;

    document.getElementById("frequency").innerText =
        rows[2].c[1].v;

    document.getElementById("network").innerText =
        rows[3].c[1].v;

    document.getElementById("qth").innerText =
        rows[4].c[1].v;

})
.catch(error => {

    document.getElementById("status").innerText =
        "Nie można pobrać statusu";

});

</script>

</body>
</html>
