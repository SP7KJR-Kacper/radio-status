        <!-- STATUS -->

        <div class="status" id="status">

        </div>


        <!-- OSTATNIA AKTUALIZACJA -->

        <div class="card">

            <div class="label">

            </div>

            <div class="value" id="updated">

            </div>

        </div>


        <!-- CZĘSTOTLIWOŚĆ -->

        <div class="card">

            <div class="label">
                CZĘSTOTLIWOŚĆ / ZNAK PRZEMIENNIKA
            </div>

            <div class="value frequency" id="frequency">
                ---
            </div>

        </div>

        <div class="card">

            <div class="label">
                SIEĆ
            </div>

            <div class="value" id="network">
                ---
            </div>

        </div>


        <!-- QTH -->

        <div class="card">

            <div class="label">
                QTH
            </div>

            <div class="value" id="qth">
                ---
            </div>

        </div>

            SP7KJR • Krótkofalarstwo
        </div>

    </main>



    <script>

        /*
         * ==========================================
         * KONFIGURACJA
         * ==========================================
         */

        const SHEET_ID =
            "1O1ScG-qOaguXs9a1Omh4icDcathXGwDEK_adtr5RpIc";


        /*
         * ==========================================
         * ADRES GOOGLE SHEETS
         * ==========================================
         */

        const SHEET_URL =
            "https://docs.google.com/spreadsheets/d/" +
            SHEET_ID +
            "/gviz/tq?tqx=out:json&headers=1&range=A:B";


        /*
         * ==========================================
         * POBIERANIE DANYCH
         * ==========================================
         */

        async function loadRadioStatus() {

            try {

                /*
                 * Zapobiega korzystaniu ze starej
                 * wersji danych zapisanej w cache.
                 */

                const url =
                    SHEET_URL +
                    "&cache=" +
                    Date.now();


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Błąd HTTP: " +
                        response.status
                    );

                }


                const text =
                    await response.text();


                /*
                 * Google Sheets zwraca odpowiedź
                 * w formacie:
                 *
                 * google.visualization.Query.setResponse(...)
                 */

                const match =
                    text.match(
                        /google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/
                    );


                if (!match) {

                    throw new Error(
                        "Nieprawidłowa odpowiedź Google Sheets."
                    );

                }


                const data =
                    JSON.parse(match[1]);


                if (
                    !data.table ||
                    !Array.isArray(data.table.rows)
                ) {

                    throw new Error(
                        "Brak danych tabeli."
                    );

                }


                /*
                 * ======================================
                 * ODCZYT DANYCH
                 * ======================================
                 */

                const values = {};


                for (
                    const row of data.table.rows
                ) {

                    if (
                        !row.c ||
                        !row.c[0] ||
                        !row.c[1]
                    ) {

                        continue;

                    }


                    const key =
                        row.c[0].v;


                    const value =
                        row.c[1].f ??
                        row.c[1].v;


                    if (
                        key !== null &&
                        key !== undefined
                    ) {

                        values[
                            String(key)
                                .trim()
                                .toLowerCase()
                        ] = value;

                    }

                }


                /*
                 * ======================================
                 * WYŚWIETLANIE DANYCH
                 * ======================================
                 *
                 * Wszystkie pola są zawsze widoczne.
                 * Ich zawartość zależy wyłącznie od
                 * danych pobranych z Google Sheets.
                 */

                document
                    .getElementById("status")
                    .textContent =
                    values.status || "---";


                document
                    .getElementById("updated")
                    .textContent =
                    values.updated || "---";


                document
                    .getElementById("frequency")
                    .textContent =
                    values.frequency || "---";


                document
                    .getElementById("network")
                    .textContent =
                    values.network || "---";


                document
                    .getElementById("qth")
                    .textContent =
                    values.qth || "---";


                /*
                 * Informacja dla programisty
                 * w konsoli przeglądarki.
                 */

                console.log(
                    "SP7KJR STATUS OK:",
                    values
                );

            }


            catch (error) {

                console.error(
                    "SP7KJR STATUS ERROR:",
                    error
                );


                /*
                 * Jeśli Google Sheets nie odpowiada,
                 * pokazujemy błąd zamiast pustej strony.
                 */

                document
                    .getElementById("status")
                    .textContent =
                    "Nie można pobrać statusu";


                document
                    .getElementById("updated")
                    .textContent =
                    "---";


                document
                    .getElementById("frequency")
                    .textContent =
                    "---";


                document
                    .getElementById("network")
                    .textContent =
                    "---";


                document
                    .getElementById("qth")
                    .textContent =
                    "---";

            }

        }


        /*
         * ==========================================
         * PIERWSZE URUCHOMIENIE
         * ==========================================
         */

        loadRadioStatus();


        /*
         * ==========================================
         * AUTOMATYCZNE ODŚWIEŻANIE
         *
         * Co 60 sekund.
         * ==========================================
         */

        setInterval(
            loadRadioStatus,
            60 * 1000
        );

    </script>

</body>
