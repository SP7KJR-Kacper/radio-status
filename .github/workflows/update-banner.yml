name: Aktualizacja statusu SP7KJR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz dane z Google Sheets
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1O1ScG-qOaguXs9a1Omh4icDcathXGwDEK_adtr5RpIc/gviz/tq?tqx=out:csv&sheet=Dane&range=B2:B6" -o data.csv

          echo "===== GOOGLE SHEETS ====="
          cat data.csv
          echo "========================="

      - name: Utwórz baner
        run: |
          python3 - <<'PY'
          import csv
          import html

          values = []

          with open("data.csv", encoding="utf-8-sig", newline="") as f:
              reader = csv.reader(f)

              for row in reader:
                  if len(row) > 0:
                      values.append(row[0].strip())

          while len(values) < 5:
              values.append("---")

          status = html.escape(values[0])
          updated = html.escape(values[1])
          frequency = html.escape(values[2])
          network = html.escape(values[3])
          qth = html.escape(values[4])

          print("STATUS:", status)
          print("UPDATED:", updated)
          print("FREQUENCY:", frequency)
          print("NETWORK:", network)
          print("QTH:", qth)

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="300"
     viewBox="0 0 900 300">

  <rect
      width="900"
      height="300"
      rx="30"
      fill="#111111"/>

  <text
      x="50"
      y="65"
      fill="#ffffff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="38"
      font-weight="bold">
    SP7KJR
  </text>

  <text
      x="50"
      y="105"
      fill="#888888"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18">
    STATUS RADIOWY
  </text>

  <text
      x="50"
      y="165"
      fill="#ffffff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="34"
      font-weight="bold">
    {status}
  </text>

  <text
      x="50"
      y="215"
      fill="#aaaaaa"
      font-family="Arial, Helvetica, sans-serif"
      font-size="22">
    {frequency} • {network}
  </text>

  <text
      x="50"
      y="255"
      fill="#aaaaaa"
      font-family="Arial, Helvetica, sans-serif"
      font-size="20">
    QTH: {qth} • {updated}
  </text>

</svg>
'''

          with open("banner/status.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          PY

      - name: Zapisz baner
        run: |
          git config user.name "SP7KJR Status Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add banner/status.svg

          git diff --cached --quiet || git commit -m "Aktualizacja statusu"

          git pull --rebase origin main

          git push origin main
