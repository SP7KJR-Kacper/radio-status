name: Aktualizacja statusu SP7KJR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:

    runs-on: ubuntu-latest

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz dane z Google Sheets
        run: |
          curl -L \
          "https://docs.google.com/spreadsheets/d/1O1ScG-qOaguXs9a1Omh4icDcathXGwDEK_adtr5RpIc/gviz/tq?tqx=out:csv&range=A:B" \
          -o data.csv

      - name: Utwórz baner
        run: |
          python3 <<'PY'
          import csv
          import html

          data = {}

          with open("data.csv", encoding="utf-8") as f:
              reader = csv.reader(f)

              for row in reader:
                  if len(row) >= 2:
                      data[row[0].strip().lower()] = row[1].strip()

          status = html.escape(data.get("status", "---"))
          updated = html.escape(data.get("updated", "---"))
          frequency = html.escape(data.get("frequency", "---"))
          network = html.escape(data.get("network", "---"))
          qth = html.escape(data.get("qth", "---"))

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="900" height="300" viewBox="0 0 900 300">

          <rect width="900" height="300" rx="30" fill="#111111"/>

          <text x="50" y="65"
                fill="white"
                font-family="Arial"
                font-size="38"
                font-weight="bold">
          📡 SP7KJR
          </text>

          <text x="50" y="105"
                fill="#888888"
                font-family="Arial"
                font-size="18">
          STATUS RADIOWY
          </text>

          <text x="50" y="165"
                fill="white"
                font-family="Arial"
                font-size="34"
                font-weight="bold">
          {status}
          </text>

          <text x="50" y="215"
                fill="#aaaaaa"
                font-family="Arial"
                font-size="22">
          {frequency} • {network}
          </text>

          <text x="50" y="255"
                fill="#aaaaaa"
                font-family="Arial"
                font-size="20">
          QTH: {qth} • {updated}
          </text>

          </svg>'''

          with open("banner/status.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Zapisz baner
        run: |
          git config user.name "SP7KJR Status Bot"
          git config user.email "actions@github.com"

          git add banner/status.svg

          git diff --cached --quiet || \
          git commit -m "Aktualizacja statusu radiowego"

          git push
